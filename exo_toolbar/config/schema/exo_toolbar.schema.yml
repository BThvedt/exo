exo_toolbar.exo_toolbar.*:
  type: config_entity
  label: 'eXo Toolbar config'
  mapping:
    id:
      type: string
      label: 'ID'
    label:
      type: label
      label: 'Label'
    uuid:
      type: string
    weight:
      type: integer
      label: 'Weight'
    settings:
      type: exo_toolbar.settings.[%parent.plugin]
    visibility:
      type: sequence
      label: 'Visibility Conditions'
      sequence:
        type: condition.plugin.[id]
        label: 'Visibility Condition'

exo_toolbar.settings.*:
  type: exo_toolbar_settings

exo_toolbar_settings:
  type: mapping
  label: 'eXo Toolbar settings'
  mapping:
    exo_default:
      type: boolean
      label: 'Use eXo default'
    enabled:
      type: sequence
      label: 'Enabled regions'
      sequence:
        type: string
    debug:
      type: boolean
      label: 'Debug mode enabled'
    regions:
      type: sequence
      label: 'Region settings'
      sequence:
        type: exo_toolbar_settings.region
    context_mapping:
      type: sequence
      label: 'Context assignments'
      sequence:
        type: string

exo_toolbar_settings.region:
  type: mapping
  label: 'Region settings'
  mapping:
    id:
      type: string
      label: 'Region ID'
    size:
      type: string
      label: 'Size'
    mark_only:
      type: boolean
      label: 'Mark only'
    theme:
      type: string
      label: 'Theme'
    expanded:
      type: boolean
      label: 'Expanded'

# The `exo_toolbar.settings.*` wildcard above does not match the
# `exo_toolbar.settings` config object itself, so it needs its own definition.
exo_toolbar.settings:
  type: config_object
  label: 'eXo Toolbar settings'
  mapping:
    exo_default:
      type: boolean
      label: 'Use eXo default'
    debug:
      type: boolean
      label: 'Debug mode enabled'
    enabled:
      type: sequence
      label: 'Enabled regions'
      sequence:
        type: string
        label: 'Region ID'
    regions:
      type: sequence
      label: 'Region settings'
      sequence:
        type: exo_toolbar_settings.region
