field.formatter.settings.micon_link:
  type: mapping
  label: 'Link format settings'
  mapping:
    trim_length:
      type: integer
      label: 'Trim link text length'
    url_only:
      type: boolean
      label: 'URL only'
    url_plain:
      type: boolean
      label: 'Show URL as plain text'
    rel:
      type: string
      label: 'Add rel="nofollow" to links'
    title:
      type: string
      label: 'Link text'
    target:
      type: string
      label: 'Open link in new window'
    class:
      type: string
      label: 'CSS class to add to link'
    icon:
      type: string
      label: 'Link icon'

field.widget.settings.micon_link:
  type: mapping
  label: 'Link with icon settings'
  mapping:
    placeholder_url:
      type: string
      label: 'Placeholder for URL'
    placeholder_title:
      type: label
      label: 'Placeholder for link text'
    target:
      type: boolean
      label: 'Open link in new window'
    class:
      type: boolean
      label: 'Allow adding CSS class'
    packages:
      type: sequence
      sequence:
        type: boolean
        label: 'Enabled'

field.widget.settings.exo_link:
  type: field.widget.settings.link_default
  label: 'eXo link widget settings'
  mapping:
    icon:
      type: boolean
      label: 'Allow icon selection'
    # Checkboxes keyed by package id, so the values are booleans not strings.
    packages:
      type: sequence
      label: 'Icon packages'
      sequence:
        type: boolean
        label: 'Package enabled'
    target:
      type: boolean
      label: 'Open link in new window'
    class:
      type: boolean
      label: 'Allow adding CSS class'
    class_list:
      type: sequence
      label: 'CSS class list'
      sequence:
        type: string
        label: 'Class label'
    linkit:
      type: boolean
      label: 'Use Linkit for internal links'
    linkit_profile:
      type: string
      label: 'Linkit profile'

# ExoLinkFormatter extends core's LinkFormatter, so trim_length/url_only/
# url_plain/rel/target come from the parent type.
field.formatter.settings.exo_link:
  type: field.formatter.settings.link
  label: 'eXo link formatter settings'
  mapping:
    title:
      type: label
      label: 'Link text'
    icon:
      type: string
      label: 'Link icon'
    position:
      type: string
      label: 'Icon position'
    title_only:
      type: boolean
      label: 'Display the title only'
