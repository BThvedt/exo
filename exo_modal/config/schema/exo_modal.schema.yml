# `modal`/`block`/`blocks` are produced by pluggable eXo settings forms, so the
# contained keys are not fixed.
block.settings.exo_modal:
  type: block_settings
  label: 'eXo Modal block'
  mapping:
    block_id:
      type: string
      label: 'Block ID'
    ajax:
      type: boolean
      label: 'Load via AJAX'
    modal:
      type: ignore
      label: 'Modal settings'
    block:
      type: ignore
      label: 'Block settings'
    blocks:
      type: ignore
      label: 'Blocks'

exo_modal.settings:
  type: config_object
  label: 'eXo Modal settings'
  mapping:
    theme:
      type: string
      label: 'Modal theme'
    theme_content:
      type: string
      label: 'Content theme'
    trigger:
      type: ignore
      label: 'Trigger defaults'
    modal:
      type: ignore
      label: 'Modal defaults'
