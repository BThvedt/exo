exo_icon.exo_icon_package.*:
  type: config_entity
  label: 'eXo Icon Package config'
  mapping:
    id:
      type: string
      label: 'ID'
    uuid:
      type: string
    label:
      type: label
      label: 'Label'
    status:
      type: boolean
      label: 'Status'
    global:
      type: boolean
      label: 'Global'
    path:
      type: string
      label: 'Path to icon directory'
    type:
      type: string
      label: 'The type of icon. Either font or image.'
    weight:
      type: integer
      label: 'Weight'

# exo_icon stores one icon-id string per config entity it decorates, keyed by
# entity:<type>:<id> (see exo_icon_entity_icon_key() in exo_icon.module) — a
# sequence of those dynamic keys, declared per config entity type that
# exo_icon_entity_support() lists.
exo_icon.entity_icons:
  type: sequence
  label: 'eXo Icon entity icons'
  sequence:
    type: string
    label: 'Icon ID'

media.type.*.third_party.exo_icon:
  type: exo_icon.entity_icons
node.type.*.third_party.exo_icon:
  type: exo_icon.entity_icons
taxonomy.vocabulary.*.third_party.exo_icon:
  type: exo_icon.entity_icons
paragraphs.paragraphs_type.*.third_party.exo_icon:
  type: exo_icon.entity_icons
commerce_product.commerce_product_type.*.third_party.exo_icon:
  type: exo_icon.entity_icons
profile.type.*.third_party.exo_icon:
  type: exo_icon.entity_icons

# Formatter settings. entity_reference_icon extends core's
# EntityReferenceLabelFormatter, so it inherits `link` via the parent type.
field.formatter.settings.entity_reference_icon:
  type: field.formatter.settings.entity_reference_label
  label: 'eXo Label with Icon formatter settings'
  mapping:
    icon_only:
      type: boolean
      label: 'Display the icon only'
    page_convert:
      type: boolean
      label: 'Convert icon on page display'
    field_name:
      type: string
      label: 'Icon field name'
      nullable: true

# file_icon extends FileFormatterBase, which declares no settings of its own,
# so every key is declared here. `target` is a checkbox with
# '#return_value' => '_blank', so it stores a string, not a boolean.
field.formatter.settings.file_icon:
  type: mapping
  label: 'eXo File Icon formatter settings'
  mapping:
    title:
      type: label
      label: 'Link title'
    entity_label:
      type: boolean
      label: 'Use the entity label as link text'
    icon:
      type: string
      label: 'Icon'
    package:
      type: string
      label: 'Icon package'
    position:
      type: string
      label: 'Icon position'
    target:
      type: string
      label: 'Link target'
    text_only:
      type: boolean
      label: 'Text only'
    icon_only:
      type: boolean
      label: 'Icon only'

# Checkboxes keyed by package id: the package name when checked, empty when not.
field.widget.settings.icon:
  type: mapping
  label: 'eXo Icon widget settings'
  mapping:
    packages:
      type: sequence
      label: 'Enabled icon packages'
      sequence:
        type: string
        label: 'Package'
