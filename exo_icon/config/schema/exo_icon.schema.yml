exo_icon.exo_icon_package.*:
  type: config_entity
  label: 'eXo Icon Package config'
  mapping:
    id:
      type: string
      label: 'ID'
    uuid:
      type: string
    label:
      type: label
      label: 'Label'
    status:
      type: boolean
      label: 'Status'
    global:
      type: boolean
      label: 'Global'
    path:
      type: string
      label: 'Path to icon directory'
    type:
      type: string
      label: 'The type of icon. Either font or image.'
    weight:
      type: integer
      label: 'Weight'

# exo_icon stores one icon-id string per config entity it decorates, keyed by
# entity:<type>:<id> (see exo_icon_entity_icon_key() in exo_icon.module) — a
# sequence of those dynamic keys, declared per config entity type that
# exo_icon_entity_support() lists.
exo_icon.entity_icons:
  type: sequence
  label: 'eXo Icon entity icons'
  sequence:
    type: string
    label: 'Icon ID'

media.type.*.third_party.exo_icon:
  type: exo_icon.entity_icons
node.type.*.third_party.exo_icon:
  type: exo_icon.entity_icons
taxonomy.vocabulary.*.third_party.exo_icon:
  type: exo_icon.entity_icons
paragraphs.paragraphs_type.*.third_party.exo_icon:
  type: exo_icon.entity_icons
commerce_product.commerce_product_type.*.third_party.exo_icon:
  type: exo_icon.entity_icons
profile.type.*.third_party.exo_icon:
  type: exo_icon.entity_icons
